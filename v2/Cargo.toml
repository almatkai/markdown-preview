[package]
name = "tezbar-native-markdown-preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0 AND BSD-3-Clause AND Unicode-3.0"
description = "Compiled Native V2 Markdown Preview engine and beta adapter"
repository = "https://github.com/almatkai/markdown-preview"
readme = "README.md"
include = ["/src/**", "/adapter/**", "/assets/**", "/fixtures/**", "/tests/**", "/scripts/**", "/licenses/**", "/harness-template/**", "/integration/**", "/validation/package.json", "/validation/package-lock.json", "/examples/wire.rs", "/*.md", "/*.json", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/.gitignore", "/.gitattributes"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
pulldown-cmark = { version = "=0.13.0", default-features = false, features = ["html"] }
regex = "=1.12.2"
uuid = { version = "=1.16.0", features = ["v4"] }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
